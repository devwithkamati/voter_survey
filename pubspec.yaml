name: voter_survey_admin

description: "Voter Survey Admin App"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.3
  http: ^1.6.0
  dio: ^5.9.2
  get_storage: ^2.1.1
  image_picker: ^1.2.2
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

# ================= APP ICON =================

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/appstore.png"

  adaptive_icon_foreground: "assets/icons/appstore.png"

  adaptive_icon_background: "#4B3CF0"

  min_sdk_android: 21

  remove_alpha_ios: true